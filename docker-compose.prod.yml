version: '3.8'

services:

  redis:
    image: redis:7-alpine
    container_name: labo-redis
    restart: unless-stopped
    networks:
      - labo-network
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  web:
    image: ghcr.io/kolomiietsoleksandr/vakansiograph:latest
    container_name: labo-web
    restart: unless-stopped
    env_file: .env
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/data/labor_market.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - db_data:/data
    networks:
      - labo-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: >
      gunicorn
      --bind 0.0.0.0:5001
      --workers 2
      --threads 2
      --timeout 300
      --access-logfile -
      --error-logfile -
      wsgi:app

  worker:
    image: ghcr.io/kolomiietsoleksandr/vakansiograph:latest
    container_name: labo-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_PATH=/data/labor_market.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - db_data:/data
    networks:
      - labo-network
    depends_on:
      web:
        condition: service_healthy
    command: python -m app.services.scheduler

  nginx:
    image: nginx:alpine
    container_name: labo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - labo-network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  labo-network:
    driver: bridge
